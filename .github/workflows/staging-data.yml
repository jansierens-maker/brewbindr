name: Copy data to staging

# Copies the public library and one brewery's recipes, library items and stock from
# production to the staging database (see docs/environments.md). Production is only read.
# Run it by hand: Actions > Copy data to staging > Run workflow.
on:
  workflow_dispatch:
    inputs:
      source_email:
        description: 'Production account whose brewery is copied'
        required: true
      target_email:
        description: 'Staging account that receives it (must exist in staging)'
        required: true

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: staging-database
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Production is read through the Management API; staging is written with psql over
      # its session pooler (the access token may not cover the staging project)
      - name: Read production
        run: node scripts/copy-to-staging.mjs
        env:
          SQL_FILE: ${{ runner.temp }}/staging.sql
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_REF: tgbeaombwskioefhunxf
          STAGING_REF: xylsffujkzcwfeyxkzve
          SOURCE_EMAIL: ${{ inputs.source_email }}
          TARGET_EMAIL: ${{ inputs.target_email }}

      - name: Write staging
        run: |
          command -v psql >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/staging.sql"
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
