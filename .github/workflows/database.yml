name: Database

# Database migrations live in supabase/migrations.
# - Pull request: start a fresh local Supabase database, apply every migration,
#   run the database tests (supabase/tests) and show what would change on production.
# - Merge to main: apply new migrations to production (after approval when the
#   "production" environment requires a reviewer).
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#   SUPABASE_DB_PASSWORD   database password of the project
on:
  pull_request:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: tgbeaombwskioefhunxf

jobs:
  test:
    name: Migrations & database tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0 # pinned: a new major (v3) changed the push flags and broke this workflow

      - name: Supabase CLI version
        run: supabase --version

      - name: Start a fresh database and apply all migrations
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - name: What would change on production (dry run)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

  deploy:
    name: Apply migrations to production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0 # pinned: a new major (v3) changed the push flags and broke this workflow

      - name: Supabase CLI version
        run: supabase --version

      - name: Apply new migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes
