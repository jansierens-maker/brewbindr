name: E2E Tests

# Runs after Vercel finishes a deployment, against THAT deployment's URL:
# - every PR push → Vercel preview (staging database) → all tests
# - every merge to main → Vercel production → only the tests that change nothing
#   (tests tagged @writes are skipped), so no test data ends up in production
# The result is reported on the commit, so it shows up as a check on the PR.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test (e.g. a Vercel preview URL)'
        required: true

jobs:
  e2e:
    name: Playwright E2E
    # Only run once a deployment has succeeded (Vercel also sends pending/failure events),
    # and only for Vercel: the Database workflow's approval for the "production"
    # environment also creates a GitHub deployment, whose URL is the Actions run page.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       !startsWith(github.event.deployment_status.environment_url || github.event.deployment_status.target_url, 'https://github.com/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test ${{ github.event.deployment.environment == 'Production' && '--grep-invert @writes' || '' }}
        env:
          CI: true
          # URL of the deployment Vercel just finished (preview or production)
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.base_url }}
          # Lets Playwright past Vercel Deployment Protection on preview URLs
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Test account: in the staging database for previews (STAGING_TEST_USER_*),
          # in production for production (TEST_USER_*, only used to log in and out)
          TEST_USER_EMAIL: ${{ github.event.deployment.environment != 'Production' && secrets.STAGING_TEST_USER_EMAIL || secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ github.event.deployment.environment != 'Production' && secrets.STAGING_TEST_USER_PASSWORD || secrets.TEST_USER_PASSWORD }}

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.event.deployment.environment || 'manual' }}
          path: playwright-report/
          retention-days: 14
