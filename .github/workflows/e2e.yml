name: E2E Tests

on:
  # Vercel's GitHub App fires a deployment_status event once a preview (or
  # production) build for a commit is actually ready, with the correct URL
  # for THAT deployment. This avoids testing against a stale/unrelated URL.
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against (defaults to the PLAYWRIGHT_BASE_URL secret)'
        required: false
        type: string

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          # Deployment-trigger: URL van déze specifieke Vercel deployment.
          # Handmatige trigger: input override, anders de vaste secret als fallback.
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url || inputs.base_url || secrets.PLAYWRIGHT_BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Testaccount credentials (aanmaken in Supabase Dashboard)
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test rapport
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
