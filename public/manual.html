    <!-- ================= PREMIERS PAS ================= -->
    <section class="doc" id="overview" data-audience="all">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-flask"></i> Premiers pas</div>
        <h2>Qu'est-ce que BrewBindr ? <span class="role-badge all">Tous</span></h2>
        <p>BrewBindr est une application web pour les brasseurs amateurs. Elle fonctionne dans votre navigateur, sur ordinateur et sur téléphone — rien à installer. Vos données sont dans le cloud et restent synchronisées entre vos appareils et votre équipe.</p>
        <h3>Ce que vous pouvez faire</h3>
        <ul class="doc-list">
          <li><strong>Recettes avec calculs en direct</strong> — DI, DF, ABV, IBU, couleur et BU:GU se calculent pendant la saisie, avec les corrections habituelles pour les sucres, la forme et l'usage du houblon et la température d'empâtage.</li>
          <li><strong>Recettes avec l'IA</strong> — décrivez une bière en langage courant et recevez une recette complète.</li>
          <li><strong>Eau</strong> — eau d'empâtage et de rinçage, température d'empâtage et volumes d'ébullition selon votre installation ; traitement de l'eau avec sels, alcalinité résiduelle et pH de maische estimé.</li>
          <li><strong>Brassins</strong> — du jour de brassage à la fermentation, jusqu'aux bouteilles ou au fût, avec dosage de levure, correction du densimètre et du réfractomètre et pression pour votre fût.</li>
          <li><strong>Analyse de dégustation par l'IA</strong> — des conseils qui comparent vos notes à la recette.</li>
          <li><strong>Bibliothèque d'ingrédients et stock</strong> — vos malts, houblons, levures et autres ingrédients, avec une gestion de stock facultative.</li>
          <li><strong>BeerXML</strong> — importer et exporter recettes et ingrédients.</li>
          <li><strong>Brasser en équipe</strong> — brassez ensemble, avec des rôles de dégustateur à administrateur.</li>
        </ul>
        <div class="callout note"><i class="fas fa-globe"></i><div>L'application et ce manuel existent en <b>anglais, néerlandais et français</b>. La langue de l'application se choisit dans <b>Système → Paramètres</b> ; celle du manuel avec les boutons <b>EN · NL · FR</b> en haut.</div></div>
      </div>
    </section>

    <section class="doc" id="accounts" data-audience="all">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-user"></i> Premiers pas</div>
        <h2>Compte &amp; connexion <span class="role-badge all">Tous</span></h2>
        <p>Vous pouvez parcourir BrewBindr sans compte, mais la plupart des fonctions demandent d'être connecté.</p>
        <h3>En tant qu'invité</h3>
        <p>Sans compte, vous pouvez consulter les <b>recettes publiques</b> et les <b>ingrédients</b>, et ouvrir <b>Paramètres</b> et <b>Aide</b>. Les éléments marqués d'un <i class="fas fa-lock" style="font-size:11px"></i> ouvrent la fenêtre de connexion.</p>
        <h3>Créer un compte</h3>
        <div class="steps">
          <div class="step"><div><b>Cliquez sur « Créer un compte »</b> en bas de la barre latérale.</div></div>
          <div class="step"><div><b>Saisissez votre e-mail et un mot de passe</b> d'au moins 12 caractères. Les mots de passe connus de fuites de données sont refusés (seul le début d'un hachage est vérifié en ligne, jamais le mot de passe lui-même). Si vous avez reçu une <b>invitation</b> par e-mail, saisissez le code — vous rejoignez cette brasserie avec le rôle de l'invitation.</div></div>
          <div class="step"><div><b>Confirmez votre adresse e-mail</b> si on vous le demande, puis connectez-vous. Sans invitation, vous recevez automatiquement votre propre brasserie.</div></div>
        </div>
        <h3>Se déconnecter</h3>
        <p>Cliquez sur votre carte de compte en bas de la barre latérale et choisissez <b>Se déconnecter</b>. Sur téléphone, c'est sous <b>Plus</b> dans la barre du bas, et aussi dans <b>Paramètres</b>.</p>
        <div class="callout tip"><i class="fas fa-lightbulb"></i><div>Connecté sur un deuxième appareil ? Recettes, brassins et stock restent synchronisés en direct — les modifications apparaissent sur les deux écrans sans recharger.</div></div>
      </div>
    </section>

    <section class="doc" id="interface" data-audience="all">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-table-columns"></i> Premiers pas</div>
        <h2>L'interface <span class="role-badge all">Tous</span></h2>
        <p>La barre latérale à gauche est votre navigation, en trois groupes — la même structure que ce manuel :</p>
        <table>
          <thead><tr><th>Groupe</th><th>Contient</th><th>Pour</th></tr></thead>
          <tbody>
            <tr><td><b>Brasserie</b></td><td>Recettes, Brassins, Notes de dégustation, Stock, Équipe, Importer, Installation de brassage</td><td>Votre espace de travail : tout ce que vous et votre équipe brassez.</td></tr>
            <tr><td><b>Bibliothèque</b></td><td>Recettes publiques, Ingrédients</td><td>Contenu partagé et votre catalogue d'ingrédients.</td></tr>
            <tr><td><b>Système</b></td><td>Paramètres, Aide &amp; manuels (et <b>Admin</b> pour les administrateurs)</td><td>Préférences, langue, unités et documentation.</td></tr>
          </tbody>
        </table>
        <p>La carte en bas de la barre latérale montre votre compte : e-mail, votre <b>rôle dans la brasserie</b> et votre brasserie. Cliquez dessus pour Paramètres et Se déconnecter.</p>
        <div class="callout note"><i class="fas fa-mobile-screen"></i><div>Sur téléphone, une <b>barre en bas</b> remplace la barre latérale, avec les écrans les plus utilisés et un menu <b>Plus</b>.</div></div>
      </div>
    </section>

    <!-- ================= POUR LES BRASSEURS ================= -->
    <section class="doc" id="recipes" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-wand-magic-sparkles"></i> Pour les brasseurs</div>
        <h2>Recettes &amp; IA <span class="role-badge brewer">Brasseur</span></h2>
        <p>Les recettes se trouvent à deux endroits : dans votre <b>Brasserie</b> (privées, à vous et votre équipe) et dans la bibliothèque publique <b>Recettes</b> (pour tous).</p>
        <h3>Créer une recette avec l'IA</h3>
        <div class="steps">
          <div class="step"><div><b>Ouvrez Brasserie → Nouvelle recette.</b></div></div>
          <div class="step"><div><b>Décrivez la bière</b> — style, alcool, amertume, ingrédients particuliers. Par exemple : <code>Une blonde belge facile à boire d'environ 5,5 %, levure épicée, brassin de 20 L</code>.</div></div>
          <div class="step"><div><b>Générez.</b> L'IA (Google Gemini) propose malts, houblons, levure, paliers d'empâtage et valeurs cibles.</div></div>
          <div class="step"><div><b>Vérifiez et ajustez,</b> puis enregistrez. Voyez le résultat comme une solide première ébauche.</div></div>
        </div>
        <div class="callout note"><i class="fas fa-gauge"></i><div>Les demandes à l'IA (recettes et analyses de dégustation) sont limitées à <b>10 par jour</b> par utilisateur, 100 pour les administrateurs.</div></div>
        <h3>Construire une recette soi-même</h3>
        <ul class="doc-list">
          <li><strong>Fermentescibles</strong> — choisissez dans votre bibliothèque et indiquez le <b>type</b> : malt, céréale non maltée, sucre, extrait liquide ou sec. Cela compte : sucres et extraits donnent tout leur extrait, et le sucre fermente complètement. Si vous choisissez un ingrédient de la bibliothèque, l'application devine le type d'après le nom (p. ex. « sucre candi » → sucre).</li>
          <li><strong>Houblons</strong> — quantité, acides alpha, <b>usage</b> (ébullition, first wort, empâtage, whirlpool, houblonnage à cru), <b>forme</b> (pellets, cônes, plugs) et durée. Le houblonnage à cru compte en jours ; le houblon de whirlpool reçoit une température (80 °C si vous ne la modifiez pas).</li>
          <li><strong>Levure</strong> — atténuation par levure.</li>
          <li><strong>Schéma d'empâtage</strong> — chargez-en un depuis votre installation ou modifiez les paliers. Le volume d'infusion du premier palier et la température du palier principal comptent pour l'eau et la DF.</li>
          <li><strong>Eau et traitement de l'eau</strong> — voir <a href="#water">Volumes d'eau</a> et <a href="#water-treatment">Traitement de l'eau &amp; pH</a>.</li>
        </ul>
        <p>La barre sombre en haut affiche les valeurs cibles pendant la saisie : ABV, IBU (avec BU:GU), couleur (SRM ou EBC) et DI (SG ou °P). Si vous avez choisi un style, les valeurs hors style sont signalées.</p>
        <h3>Noms, modifier et supprimer</h3>
        <ul class="doc-list">
          <li><strong>Copie</strong> — <i class="fas fa-copy"></i> sur une carte de recette ou <b>Faire une copie</b> dans l'éditeur enregistre une copie privée nommée « … (copie) » et l'ouvre, p. ex. pour essayer une variante ou un plus petit brassin. Les brassins et notes de dégustation restent avec l'original.</li>
          <li><strong>Noms uniques</strong> — un nom de recette n'existe qu'une fois par brasserie (majuscules et espaces en trop ne comptent pas) ; dans la bibliothèque publique, chaque nom n'existe qu'une fois.</li>
          <li><strong>Modifier ou consulter</strong> — les administrateurs et maîtres brasseurs de la brasserie modifient toutes ses recettes ; brasseurs et dégustateurs ouvrent les recettes en lecture seule (bouton <b>Consulter</b>). Seul l'administrateur de l'application peut modifier les recettes publiques approuvées.</li>
          <li><strong>Supprimer une recette avec des brassins</strong> — si des brassins dépendent encore de la recette, l'application demande si vous voulez supprimer la recette <b>avec ces brassins et leurs notes de dégustation</b>, ou annuler. Une recette utilisée par les brassins d'une autre brasserie ne peut pas être supprimée.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-print"></i><div>Chaque recette a une <b>vue imprimable</b> — une fiche de brassage claire à imprimer ou à enregistrer en PDF, avec les volumes d'eau, la température d'empâtage, les avertissements et le traitement de l'eau.</div></div>
      </div>
    </section>

    <section class="doc" id="calculations" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-calculator"></i> Pour les brasseurs</div>
        <h2>Comment BrewBindr calcule <span class="role-badge brewer">Brasseur</span></h2>
        <table>
          <thead><tr><th>Valeur</th><th>Comment</th></tr></thead>
          <tbody>
            <tr><td><b>DI</b></td><td>Extrait de chaque ingrédient sur le volume du brassin. Le <b>rendement</b> ne s'applique qu'à ce qui est empâté (malts, céréales non maltées) ; sucres et extraits comptent à 100 %.</td></tr>
            <tr><td><b>DF</b></td><td>Atténuation moyenne de la levure, environ 1 point de moins par °C au-dessus de 66 °C pour le palier principal (et plus en dessous), au maximum 5 points. Le sucre fermente complètement, le lactose pas.</td></tr>
            <tr><td><b>ABV</b></td><td>La formule précise <code>76,08 × (DI − DF) / (1,775 − DI) × DF / 0,794</code>, juste aussi pour les bières fortes. Bouteilles : + 0,065 % par g/L de sucre de refermentation (pas pour un fût).</td></tr>
            <tr><td><b>IBU</b></td><td>Tinseth. Cônes environ 10 % de moins que les pellets ; houblon first wort 10 % de plus ; houblon à l'empâtage 20 % d'une ébullition complète ; houblon de whirlpool moins à mesure que la température baisse. Avec une installation, la densité moyenne pendant l'ébullition est prise en compte.</td></tr>
            <tr><td><b>Couleur</b></td><td>Morey, en SRM ou EBC.</td></tr>
            <tr><td><b>BU:GU</b></td><td>IBU divisé par les points de densité : autour de 0,5 équilibré, plus bas malté, plus haut amer.</td></tr>
          </tbody>
        </table>
        <div class="callout note"><i class="fas fa-droplet"></i><div>Si vous saisissez vous-même l'eau d'empâtage et de rinçage dans une recette, DI, DF, ABV, IBU et couleur suivent le volume qui sort réellement de la cuve.</div></div>
      </div>
    </section>

    <section class="doc" id="water" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-droplet"></i> Pour les brasseurs</div>
        <h2>Volumes d'eau &amp; température d'empâtage <span class="role-badge brewer">Brasseur</span></h2>
        <p>Le bloc <b>Eau</b> de la recette (et du jour de brassage) calcule l'eau à partir de la recette et de votre <a href="#installation">installation de brassage</a>. Une recette peut choisir son installation ; sinon l'application utilise la seule installation de votre brasserie (« Par défaut : … »).</p>
        <h3>Comment les volumes sont déterminés</h3>
        <ul class="doc-list">
          <li><strong>Après ébullition</strong> = brassin (dans le fermenteur) − eau d'appoint + pertes de trub et de refroidissement.</li>
          <li><strong>Avant ébullition</strong> = après ébullition + évaporation (L par heure × durée d'ébullition).</li>
          <li><strong>Eau totale</strong> = avant ébullition + eau absorbée par le grain (1 L/kg, BIAB 0,7, ou la valeur de l'installation) + pertes de filtration.</li>
          <li><strong>Eau d'empâtage</strong> = la première infusion du schéma d'empâtage, sinon 3 L/kg ; en BIAB toute l'eau. Jamais plus que ce qui tient à côté du grain (voir plus bas). L'<b>eau de rinçage</b> est le reste.</li>
          <li><strong>Température d'empâtage</strong> = <code>T + 0,41 / rapport × (T − température du grain)</code> (Palmer), avec T le premier palier et le rapport eau/grain en L/kg.</li>
          <li><strong>Densité avant ébullition</strong> déduite de la DI et des volumes.</li>
        </ul>
        <h3>Appareils à capacité limitée (p. ex. Brewie)</h3>
        <p>Dans certains appareils, le grain est dans des sacs dans la cuve d'empâtage : plus il y a de grain, moins il reste de place pour l'eau. Renseignez pour l'installation la <b>capacité d'empâtage</b> (eau + grain), le <b>volume du grain</b> par kg et la <b>capacité de la cuve d'ébullition</b>. L'eau d'empâtage calculée ne dépasse alors jamais <code>capacité d'empâtage − grain × volume par kg</code> ; le reste va à l'eau de rinçage. Un avertissement apparaît si l'eau d'empâtage a été limitée, s'il y a trop de grain (moins de 2 L d'eau par kg), si votre eau d'empâtage saisie ne tient pas, s'il y a plus de moût que la cuve d'ébullition ne peut contenir, ou s'il y a plus de malt que le <b>malt max.</b> de l'installation.</p>
        <h3>Trop grand ou trop petit pour l'installation</h3>
        <p>Si une recette ne tient pas dans l'installation (plus de moût que la cuve d'ébullition ne contient, trop de grain pour la cuve d'empâtage, ou un brassin plus grand que la taille de l'installation), un bandeau propose le plus grand brassin qui tient, arrondi vers le bas à 0,5 L. Si l'installation peut brasser au moins 10 % de plus, il propose d'agrandir. Tout est recalculé proportionnellement : malt (10 g), houblon (1 g), autres ingrédients, levure sèche, sels et acide (0,1), infusions d'empâtage et votre propre eau. Densité, couleur, amertume, durées et températures restent identiques.</p>
        <ul class="doc-list">
          <li><strong>Dans la recette</strong> — <b>Convertir en …</b> modifie la recette elle-même après confirmation ; enregistrez la recette pour la garder.</li>
          <li><strong>Le jour du brassage</strong> — le même bandeau apparaît à l'onglet jour de brassage. Seul ce brassin est recalculé ; la recette reste inchangée. Le brassin affiche les nouvelles quantités, le volume en fermenteur suit, et le rapport de brassage imprime les quantités recalculées. <b>Revenir à la taille de la recette</b> l'annule.</li>
        </ul>
        <p>Avec la Brewie (cuve de 23 L, évaporation 2 L/h, pertes 2 L), une ébullition de 60 minutes permet environ 19 L. Vérifiez l'évaporation et les pertes de l'installation si cela paraît peu.</p>
        <h3>Votre propre eau</h3>
        <ul class="doc-list">
          <li><strong>Eau d'empâtage et de rinçage</strong> se saisissent par recette (p. ex. comme dans Brewie Studio). Appuyez sur Entrée ou cliquez hors du champ. Les valeurs calculées restent visibles ; <b>Utiliser l'eau calculée</b> les rétablit.</li>
          <li>Le bloc affiche alors ce qui arrive <b>dans le fermenteur</b> et la <b>DI attendue</b>, et les chiffres de la recette suivent.</li>
          <li><strong>Tout transvaser dans le fermenteur</strong> — cochez si vous transvasez tout : pas de pertes de trub et de refroidissement pour cette recette. Désactivé par défaut.</li>
        </ul>
        <div class="callout note"><i class="fas fa-circle-info"></i><div>Non pris en compte : la contraction au refroidissement (environ 4 %). Si vos volumes ne correspondent jamais, ajustez les pertes ou l'évaporation de votre installation.</div></div>
      </div>
    </section>

    <section class="doc" id="water-treatment" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-vial"></i> Pour les brasseurs</div>
        <h2>Traitement de l'eau &amp; pH de maische <span class="role-badge brewer">Brasseur</span></h2>
        <h3>Profils d'eau</h3>
        <p>Ajoutez votre eau du robinet dans <b>Installation de brassage → Profils d'eau</b> : calcium, magnésium, sodium, chlorure, sulfate et bicarbonate en mg/L. Votre distributeur d'eau publie ces valeurs par adresse (cherchez « qualité de l'eau »). Le bicarbonate est parfois donné comme alcalinité ou TAC : 1 °dH ≈ 21,8 mg/L, 1 °f TAC ≈ 12,2 mg/L de bicarbonate.</p>
        <p>Toujours disponibles : eau osmosée, eaux classiques (Pilsen, Munich, Vienne, Dortmund, Dublin, Édimbourg, Londres, Burton), profils cibles par couleur et <b>19 profils par style de bière</b> (IPA, NEIPA, pale ale, pils, blonde belge, tripel, dubbel, quadrupel, saison, blanche, weizen, ambrée, Märzen, stouts).</p>
        <h3>Traiter l'eau d'une recette</h3>
        <div class="steps">
          <div class="step"><div><b>Eau de base</b> — votre propre profil (votre seul profil est choisi par défaut) ou une eau classique. Éventuellement une part d'<b>eau osmosée</b>.</div></div>
          <div class="step"><div><b>Profil cible</b> — un style de bière, un profil de couleur ou un autre profil.</div></div>
          <div class="step"><div><b>Sels</b> — gypse, chlorure de calcium (liquide 33 % ou 36 % en ml, ou paillettes en g), sel d'Epsom, sel de table, bicarbonate de soude. Ou cliquez sur <b>Proposer des sels</b> : l'application cherche les doses les plus proches de la cible (les sels ne peuvent qu'ajouter, jamais retirer).</div></div>
          <div class="step"><div><b>Voyez le résultat</b> — le tableau montre eau de base, eau traitée et cible ; en dessous l'<b>alcalinité résiduelle</b> et le rapport <b>sulfate/chlorure</b> (au-dessus de 2 amer, 0,8–2 équilibré, sous 0,8 malté). Sous 40 mg/L de calcium, un avertissement apparaît.</div></div>
        </div>
        <h3>pH de maische et acide</h3>
        <p>Le bloc estime le <b>pH de maische</b> à partir des malts (pâle, caramel, torréfié, acidulé — reconnus au nom ou à la couleur) et de l'eau d'empâtage avec tous les sels. Choisissez un <b>pH cible</b> (5,4 par défaut) et cliquez sur <b>Utiliser … ml</b> pour remplir l'<b>acide lactique 80 %</b> qui atteint cette cible. Vous voyez le pH avec et sans acide ; 5,2–5,6 est la plage habituelle.</p>
        <div class="callout tip"><i class="fas fa-flask-vial"></i><div>Mettez tous les sels et l'acide dans la <b>maische</b>. Le profil est calculé sur toute l'eau de brassage. Le pH est une estimation (en général à ±0,1 près) : vérifiez avec un pH-mètre sur un échantillon refroidi. Le jour du brassage, le bloc affiche ce qu'il faut ajouter.</div></div>
      </div>
    </section>

    <section class="doc" id="brewlogs" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-clipboard-list"></i> Pour les brasseurs</div>
        <h2>Brassins <span class="role-badge brewer">Brasseur</span></h2>
        <p>Un brassin fait d'une recette un vrai lot. Chaque brassin passe par quatre phases ; l'onglet actif suit le statut.</p>
        <div class="pipeline">
          <div class="phase"><i class="fas fa-fire-burner"></i><div class="phase-name">1. Brassage</div><div class="phase-desc">Eau, levure, empâtage, DI mesurée, volume</div></div>
          <div class="phase"><i class="fas fa-flask"></i><div class="phase-name">2. Fermentation</div><div class="phase-desc">DF, température de fermentation</div></div>
          <div class="phase"><i class="fas fa-snowflake"></i><div class="phase-name">3. Garde</div><div class="phase-desc">Maturation</div></div>
          <div class="phase"><i class="fas fa-bottle-water"></i><div class="phase-name">4. Embouteillage</div><div class="phase-desc">Bouteilles ou fût, carbonatation</div></div>
        </div>
        <h3>Jour de brassage</h3>
        <ul class="doc-list">
          <li><strong>Eau et traitement de l'eau</strong> de la recette : volumes, température d'empâtage et ce qu'il faut ajouter.</li>
          <li><strong>Dosage de levure</strong> — les cellules nécessaires selon DI, volume et type de levure (ale 0,75, lager 1,5 million de cellules/ml/°P, un tiers de plus au-dessus de 1,060), comparées à ce que vous avez : levure sèche 20 milliards/g, levure liquide 100 milliards par sachet moins environ 0,7 % par jour depuis la date de fabrication. Pas assez de levure liquide ? L'application propose le plus petit levain sur agitateur magnétique, avec l'extrait de malt sec ; pour la levure sèche, combien de grammes il vous faut.</li>
          <li><strong>Acides alpha mesurés</strong> par houblon, s'ils diffèrent de la recette ; l'IBU suit.</li>
          <li><strong>DI et volume mesurés</strong> dans le fermenteur.</li>
        </ul>
        <h3>Mesurer la densité</h3>
        <ul class="doc-list">
          <li>Saisissez DI et DF en <b>SG ou °P</b> (voir <a href="#settings">Paramètres</a>) ; elles sont toujours enregistrées en SG.</li>
          <li><strong>Densimètre</strong> — sous un champ de densité, ouvrez <b>Correction de température ou réfractomètre</b> et saisissez la température de l'échantillon : un bouton corrige la mesure à 20 °C.</li>
          <li><strong>Réfractomètre</strong> — saisissez les °Brix. Pour la DI, la conversion utilise votre facteur de correction (WCF) ; pour la DF, elle est aussi corrigée pour l'alcool (Terrill), d'après la DI au-dessus.</li>
        </ul>
        <h3>Bouteilles ou fût</h3>
        <ul class="doc-list">
          <li><strong>Bouteilles</strong> — sucre de refermentation pour le nombre de volumes de CO₂ choisi, le type de sucre, le volume et la température de fermentation ; l'ABV attendu tient compte du sucre.</li>
          <li><strong>Fût</strong> — la pression de CO₂ à régler (bar et psi au-dessus de la pression atmosphérique) pour le nombre de volumes choisi à la température de la bière (4 °C par défaut). Pas de sucre, donc pas d'alcool en plus.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-chart-line"></i><div>Les dates des phases se remplissent quand vous changez le statut, et restent modifiables.</div></div>
      </div>
    </section>

    <section class="doc" id="tasting" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-star-half-stroke"></i> Pour les brasseurs</div>
        <h2>Notes de dégustation <span class="role-badge brewer">Brasseur</span></h2>
        <p>Quand un lot est embouteillé, notez son goût : scores pour l'aspect, l'arôme, le goût et la sensation en bouche, un score global et un commentaire. Chaque membre de la brasserie peut ajouter des notes.</p>
        <h3>Ajouter une note</h3>
        <ul class="doc-list">
          <li><strong>Commencez</strong> de trois façons : <b>Notes de dégustation → Nouvelle note de dégustation</b> — les cinq lots embouteillés ou dégustés le plus récemment s'affichent, ou tapez une partie du nom de la recette ou le numéro de lot pour chercher ; <b>+ Note de dégustation</b> sur un lot de l'aperçu ; ou <b>Évaluer</b> sur un brassin embouteillé. Les dégustateurs voient la liste des brassins sans les ouvrir ; ils peuvent utiliser Évaluer.</li>
          <li><strong>Épuisé</strong> — quand les bouteilles d'un lot sont bues, marquez-le <b>Épuisé</b> dans Brassins. Il n'est plus proposé pour de nouvelles notes (cochez « Aussi les lots épuisés » pour le voir quand même) ; ses notes restent.</li>
          <li><strong>Date de dégustation</strong> — aujourd'hui par défaut ; modifiez-la pour saisir une dégustation après coup. La note indique l'âge de la bière, p. ex. « 3 semaines après l'embouteillage ».</li>
          <li><strong>Dégustateur</strong> — vous, ou <b>un invité sans compte</b> : tapez son nom. Les notes d'invités portent l'étiquette <b>Invité</b> et « saisi par » avec votre nom. Il faut toujours être connecté pour ajouter des notes.</li>
        </ul>
        <h3>L'aperçu</h3>
        <ul class="doc-list">
          <li><strong>Par lot</strong> — les notes d'un même brassin sont regroupées sous la recette et son numéro de lot (lot 1, 2, … dans l'ordre des dates de brassage), avec dates de brassage et d'embouteillage, le nombre de dégustations, la note moyenne et un petit graphique de la note globale selon l'âge.</li>
          <li><strong>Filtres</strong> — par dégustateur (membres et invités), recette et lot ; tri par plus récentes, plus anciennes ou meilleure note. Un brassin embouteillé affiche aussi ses notes ; cliquez pour les ouvrir.</li>
          <li><strong>Modifier et supprimer</strong> — vos propres notes ; les administrateurs et maîtres brasseurs de la brasserie peuvent modifier ou supprimer toutes les notes.</li>
          <li><strong>Noms des dégustateurs</strong> — votre nom affiché dans <a href="#settings">Paramètres</a>, sinon la partie de votre e-mail avant le @.</li>
        </ul>
        <h3>Analyse de dégustation par l'IA</h3>
        <div class="steps">
          <div class="step"><div><b>Rédigez votre commentaire</b> — soyez précis : « esters de banane dominants, moins amer que prévu, un peu mince ».</div></div>
          <div class="step"><div><b>Cliquez sur Analyser</b> <i class="fas fa-brain" style="font-size:11px"></i>. L'IA compare votre description à la recette.</div></div>
          <div class="step"><div><b>Lisez les conseils :</b> causes probables et pistes pour le prochain brassin. Ils sont enregistrés avec la note ; rouvrez-les avec <b>Afficher l'analyse IA</b>.</div></div>
        </div>
<div class="callout note"><i class="fas fa-circle-info"></i><div>L'analyse demande un commentaire écrit et compte dans votre limite quotidienne de demandes à l'IA.</div></div>
      </div>
    </section>

    <section class="doc" id="stock" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-boxes-stacked"></i> Pour les brasseurs</div>
        <h2>Gestion du stock <span class="role-badge brewer">Brasseur</span></h2>
        <p>Le stock est <b>facultatif</b> — activez-le dans <b>Paramètres → Gestion du stock</b>, et « Stock » apparaît dans la barre latérale sous Brasserie. Les recettes indiquent alors si vous pouvez les brasser avec ce que vous avez.</p>
        <p>L'écran Stock montre vos ingrédients avec la quantité disponible. Chacun reçoit un <b>verre</b> qui se remplit selon votre stock. Essayez :</p>
        <div class="glass-demo">
          <svg class="glass-svg" viewBox="0 0 60 80" aria-hidden="true">
            <defs><clipPath id="demoClip"><path d="M10 6 h40 l-4.5 62 a5 5 0 0 1 -5 4.6 h-21 a5 5 0 0 1 -5 -4.6 Z"/></clipPath></defs>
            <path d="M8 4 h44 l-5 66 a6 6 0 0 1 -6 5.5 h-22 a6 6 0 0 1 -6 -5.5 Z" fill="#fff" stroke="#CBD5E1" stroke-width="2.5"/>
            <rect id="demoFill" x="0" y="28" width="60" height="80" fill="#F59E0B" clip-path="url(#demoClip)"/>
            <ellipse id="demoFoam" cx="30" cy="28" rx="19" ry="4" fill="#FEF3C7" clip-path="url(#demoClip)"/>
          </svg>
          <div>
            <div class="demo-label">Glissez pour simuler le stock</div>
            <input type="range" id="demoRange" name="demoRange" min="0" max="100" value="65" aria-label="Pourcentage de stock simulé">
            <div class="demo-pct"><span id="demoPct">65</span>%</div>
          </div>
        </div>
        <h3>Utiliser l'écran</h3>
        <ul class="doc-list">
          <li><strong>Filtrez</strong> par type d'ingrédient ou cherchez par nom.</li>
          <li><strong>Basculez</strong> entre cartes (avec verres) et un tableau compact.</li>
          <li><strong>Ajustez les quantités</strong> quand vous achetez ou utilisez quelque chose. Elles sont arrondies : kg au gramme près, g en grammes entiers. Seuls les administrateurs et maîtres brasseurs modifient le stock ; les brasseurs peuvent le consulter ; les dégustateurs ne le voient pas.</li>
        </ul>
      </div>
    </section>

    <section class="doc" id="library" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-seedling"></i> Pour les brasseurs</div>
        <h2>Bibliothèque d'ingrédients <span class="role-badge brewer">Brasseur</span></h2>
        <p>La bibliothèque est votre catalogue de matières premières. Dans le menu, sous <b>Bibliothèque</b>, vous trouvez <b>Ingrédients</b> (malt, houblon, levure, autres), <b>Profils d'empâtage</b>, <b>Styles de bière</b>, <b>Installations</b> et <b>Profils d'eau</b>, chacun avec votre collection et la bibliothèque publique (installations et profils d'eau : public uniquement).</p>
        <table>
          <thead><tr><th>Type</th><th>Exemples</th><th>Propriétés principales</th></tr></thead>
          <tbody>
            <tr><td><b>Fermentescible</b></td><td>Malt pils, Munich, sucre candi</td><td>Rendement, couleur</td></tr>
            <tr><td><b>Houblon</b></td><td>Saaz, Citra, East Kent Goldings</td><td>Acides alpha %</td></tr>
            <tr><td><b>Levure</b></td><td>Souches de levure, bactéries</td><td>Atténuation, forme</td></tr>
            <tr><td><b>Divers</b></td><td>Mousse d'Irlande, coriandre, écorce d'orange</td><td>Usage, moment</td></tr>
            <tr><td><b>Schémas d'empâtage, styles</b></td><td>Infusion simple, styles BJCP</td><td>Paliers ; plages par style</td></tr>
          </tbody>
        </table>
        <p>Ce que vous ajoutez est privé pour votre brasserie, et un nom n'existe qu'une fois par type dans votre brasserie. Pour créer des recettes, vous choisissez dans cette bibliothèque — une bibliothèque bien tenue rend les recettes rapides.</p>
        <div class="callout note"><i class="fas fa-upload"></i><div>L'<b>administrateur de la brasserie</b> peut <b>proposer</b> des ingrédients ou recettes pour la bibliothèque publique. Si le nom existe déjà ou attend une validation, un avertissement apparaît d'abord. Les éléments proposés ne deviennent publics qu'après validation par un administrateur.</div></div>
        <p>Les <b>installations de brassage et profils d'eau</b> sont aussi dans la bibliothèque publique, sous <b>Bibliothèque → Installations</b> et <b>Bibliothèque → Profils d'eau</b> : ajoutez-en un à votre collection et il apparaît sous Installation de brassage. L'administrateur de la brasserie propose les siens avec le bouton <i class="fas fa-cloud-upload-alt"></i> sur l'installation ou le profil d'eau (sous Installation de brassage). Le réglage par défaut (★) n'est pas partagé.</p>
      </div>
    </section>

    <section class="doc" id="installation" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-temperature-half"></i> Pour les brasseurs</div>
        <h2>Installation de brassage <span class="role-badge brewer">Brasseur</span></h2>
        <p>Décrivez votre matériel et votre eau, pour que les calculs correspondent à la réalité. L'écran a trois onglets : <b>Installation</b>, <b>Schémas d'empâtage</b> et <b>Profils d'eau</b>. Tout ici est partagé avec votre brasserie.</p>
        <h3>Installation</h3>
        <p>Partez d'un modèle ou créez la vôtre : taille du brassin, rendement, durée d'ébullition, cuves, et les valeurs utilisées par le calcul de l'eau :</p>
        <table>
          <thead><tr><th>Champ</th><th>Utilisé pour</th></tr></thead>
          <tbody>
            <tr><td>Pertes de trub et de refroidissement, eau d'appoint</td><td>Volumes après ébullition</td></tr>
            <tr><td>Évaporation (L/h)</td><td>Volume et densité avant ébullition</td></tr>
            <tr><td>Pertes de filtration</td><td>Eau totale</td></tr>
            <tr><td>Capacité d'empâtage (eau + grain), volume du grain dans la maische (L/kg)</td><td>Eau d'empâtage maximale</td></tr>
            <tr><td>Absorption du grain (L/kg)</td><td>Eau totale (1,0 par défaut, BIAB 0,7)</td></tr>
            <tr><td>Capacité de la cuve d'ébullition</td><td>Avertissement en cas de trop de moût</td></tr>
            <tr><td>Malt max. (kg)</td><td>Avertissement s'il y a plus de malt que le tube à malt ou la cuve n'accepte ; le brassin peut être réduit</td></tr>
          </tbody>
        </table>
        <h3>Quelle installation est utilisée</h3>
        <p>Les volumes d'eau, la température d'empâtage et le recalcul utilisent, dans cet ordre : l'installation choisie pour le brassin, celle de la recette, l'installation <b>par défaut</b> de la brasserie. Cliquez sur ★ d'une installation pour la mettre par défaut ; cliquez à nouveau pour retirer le défaut. Une brasserie avec une seule installation utilise celle-ci. Avec plusieurs installations, <b>Brasser</b> demande d'abord sur quelle installation vous brassez (celle de la recette est indiquée), sauf s'il y a une installation par défaut et que la recette l'utilise ou n'en indique aucune. Le jour du brassage, vous pouvez encore la changer dans le bloc eau ; la recette reste inchangée.</p>
        <details>
          <summary>Modèles d'installation intégrés</summary>
          <div class="details-body">
            <table>
              <thead><tr><th>Modèle</th><th>Type</th><th>Brassin</th><th>Rendement</th></tr></thead>
              <tbody>
                <tr><td>Brewie</td><td>Deux cuves (capacité d'empâtage 22 L, 1 L/kg, cuve d'ébullition 23 L)</td><td>23 L</td><td>70%</td></tr>
                <tr><td>Grainfather G30</td><td>Tout-en-un</td><td>25 L</td><td>72%</td></tr>
                <tr><td>Grainfather G40</td><td>Tout-en-un (46 L, malt max. 13 kg)</td><td>35 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B40</td><td>Tout-en-un (40 L, malt max. 8 kg)</td><td>30 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B50</td><td>Tout-en-un (50 L, malt max. 12 kg)</td><td>45 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B70</td><td>Tout-en-un (70 L, malt max. 18 kg)</td><td>65 L</td><td>72%</td></tr>
                <tr><td>Robobrew / BrewZilla</td><td>Tout-en-un</td><td>30 L</td><td>70%</td></tr>
                <tr><td>BIAB 20 L</td><td>Brew-in-a-bag</td><td>20 L</td><td>65%</td></tr>
                <tr><td>BIAB 30 L</td><td>Brew-in-a-bag</td><td>30 L</td><td>65%</td></tr>
                <tr><td>Classique 3 cuves 20 L</td><td>Eau chaude, empâtage, ébullition</td><td>20 L</td><td>75%</td></tr>
                <tr><td>Classique 3 cuves 30 L</td><td>Eau chaude, empâtage, ébullition</td><td>30 L</td><td>75%</td></tr>
              </tbody>
            </table>
          </div>
        </details>
        <h3>Schémas d'empâtage</h3>
        <p>Schémas d'empâtage réutilisables (température, durée, type, volume d'infusion). Chargez-en un dans une recette ; il apparaît comme liste de contrôle le jour du brassage. Les températures sont enregistrées au 0,1 °C près.</p>
        <h3>Profils d'eau</h3>
        <p>Votre eau du robinet et d'autres eaux avec leurs minéraux ; voir <a href="#water-treatment">Traitement de l'eau</a>.</p>
      </div>
    </section>

    <section class="doc" id="import" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-arrow-up-from-bracket"></i> Pour les brasseurs</div>
        <h2>Importer &amp; exporter <span class="role-badge brewer">Brasseur</span></h2>
        <p>BrewBindr parle <b>BeerXML</b>, le format d'échange des logiciels de brassage (BeerSmith, Brewfather et autres).</p>
        <h3>Importer</h3>
        <div class="steps">
          <div class="step"><div><b>Ouvrez Brasserie → Importer.</b> Vous devez être connecté comme administrateur ou maître brasseur (l'importation ajoute des recettes et ingrédients) ; tout le monde peut exporter.</div></div>
          <div class="step"><div><b>Choisissez un fichier</b> — <code>.xml</code> ou <code>.beerxml</code>, jusqu'à <b>10 Mo</b>, avec recettes ou ingrédients.</div></div>
          <div class="step"><div><b>Vérifiez le résultat.</b> Les recettes arrivent dans votre brasserie, les ingrédients dans votre bibliothèque.</div></div>
        </div>
        <p>Les valeurs importées sont nettoyées (p. ex. 2,041164 kg → 2,041 kg, 65,555556 °C → 65,6 °C). Le type de fermentescible, l'usage et la forme du houblon et les minéraux des profils d'eau sont aussi importés.</p>
        <h3>Exporter</h3>
        <p>Exportez une recette en BeerXML depuis la recette, comme sauvegarde ou pour un autre logiciel. Types, usage et forme du houblon sont conservés, et les quantités impériales sont écrites en kg.</p>
      </div>
    </section>

    <section class="doc" id="team" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-users"></i> Pour les brasseurs</div>
        <h2>Équipe &amp; rôles <span class="role-badge brewer">Brasseur</span></h2>
        <p>Chaque utilisateur appartient à une <b>brasserie</b> — un espace de travail partagé. Chaque membre a l'un des quatre rôles :</p>
        <table>
          <thead><tr><th>Rôle</th><th>Droits</th></tr></thead>
          <tbody>
            <tr><td><b>Administrateur</b></td><td>Tout ce que peut un maître brasseur, plus les membres, les invitations, le nom de la brasserie et la proposition de recettes, d'ingrédients, d'installations et de profils d'eau à la bibliothèque publique.</td></tr>
            <tr><td><b>Maître brasseur</b></td><td>Crée, modifie et supprime toutes les recettes, ingrédients et données d'installation de la brasserie ; suit les brassins.</td></tr>
            <tr><td><b>Brasseur</b></td><td>Suit les brassins ; consulte les recettes (lecture seule).</td></tr>
            <tr><td><b>Dégustateur</b></td><td>Consulte les recettes et la liste des brassins (sans les ouvrir) ; ajoute des notes de dégustation. Ne voit pas le stock.</td></tr>
          </tbody>
        </table>
        <h3>Inviter et rejoindre</h3>
        <ul class="doc-list">
          <li><strong>Inviter</strong> — dans l'écran <b>Équipe</b>, saisissez un e-mail et un rôle. La personne invitée reçoit un e-mail avec un code valable 7 jours. Chaque invitation indique combien de fois l'e-mail a été envoyé et peut être renvoyée (3 fois au maximum) ; une brasserie envoie au maximum 10 e-mails d'invitation par jour. Si l'e-mail ne part pas, l'invitation reste : transmettez vous-même le code. Le code fonctionne en majuscules ou minuscules.</li>
          <li><strong>Rejoindre</strong> — saisissez le code en créant votre compte, ou plus tard sous <b>Rejoindre une autre brasserie</b>. Vos recettes, brassins, notes et ingrédients vous suivent ; c'est possible si vous êtes le seul membre de votre brasserie actuelle. Les noms qui existent déjà reçoivent « (2) ».</li>
          <li><strong>Retirer</strong> — un administrateur peut retirer des membres dans l'écran Équipe.</li>
        </ul>
      </div>
    </section>

    <section class="doc" id="settings" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-gear"></i> Pour les brasseurs</div>
        <h2>Paramètres <span class="role-badge all">Tous</span></h2>
        <p>Dans <b>Système → Paramètres</b>, adaptez BrewBindr à votre façon de travailler :</p>
        <ul class="doc-list">
          <li><strong>Unités</strong> — métriques (L, kg, °C) ou impériales (gal, lb, °F), partout.</li>
          <li><strong>Échelle de couleur</strong> — SRM ou EBC.</li>
          <li><strong>Densité</strong> — SG, °P ou les deux, pour afficher et saisir les densités.</li>
          <li><strong>Facteur de correction du réfractomètre (WCF)</strong> — en général 1,02–1,06, 1,04 si vous ne savez pas. Mesurez un moût au densimètre et au réfractomètre pour trouver votre propre facteur.</li>
          <li><strong>Gestion du stock</strong> — activée ou non (voir <a href="#stock">Stock</a>).</li>
          <li><strong>Langue</strong> — English, Nederlands ou Français.</li>
          <li><strong>Nom affiché</strong> — sous Compte : le nom que voit votre équipe, p. ex. comme dégustateur de vos notes (40 caractères max.).</li>
          <li><strong>Changer le mot de passe</strong> — sous Compte : votre mot de passe actuel et deux fois le nouveau (au moins 12 caractères, inconnu des fuites de données). Oublié ? Utilisez <b>Mot de passe oublié ?</b> sur l'écran de connexion : vous recevez un e-mail avec un lien, valable une heure, pour choisir un nouveau mot de passe.</li>
          <li><strong>Compte</strong> — le compte connecté, et se déconnecter.</li>
        </ul>
        <p class="kbd-note">Vos préférences sont enregistrées avec votre profil et vous suivent sur tous vos appareils.</p>
      </div>
    </section>

    <!-- ================= POUR LES ADMINISTRATEURS ================= -->
    <section class="doc" id="admin-submissions" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-clipboard-check"></i> Pour les administrateurs</div>
        <h2>Bibliothèque publique <span class="role-badge admin">Admin</span></h2>
        <h3>Examiner les propositions</h3>
        <p>Les administrateurs d'une brasserie peuvent proposer recettes et ingrédients pour la bibliothèque publique. Rien n'apparaît sans contrôle : les propositions attendent dans l'écran <b>Admin</b> sous <b>À examiner</b>.</p>
        <div class="steps">
          <div class="step"><div><b>Ouvrez l'écran Admin.</b> Chaque élément montre type, nom et auteur de la proposition.</div></div>
          <div class="step"><div><b>Évaluez la qualité :</b> données complètes et plausibles, nom pertinent. Les noms de la bibliothèque publique sont uniques : approuver un élément dont le nom est déjà public est refusé.</div></div>
          <div class="step"><div><b>Approuvez</b> pour publier, ou <b>refusez</b>.</div></div>
        </div>
        <h3>Faire le ménage</h3>
        <p>Dans la bibliothèque publique, les administrateurs voient pour recettes et ingrédients <b>Retirer du public</b> (l'élément redevient privé) et <b>Supprimer</b>. Une recette publique utilisée par les brassins d'autres brasseries ne peut pas être supprimée.</p>
        <div class="callout warn"><i class="fas fa-triangle-exclamation"></i><div>Le contenu approuvé est visible par <b>tout le monde</b>, invités compris.</div></div>
      </div>
    </section>

    <section class="doc" id="admin-tools" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-tools"></i> Pour les administrateurs</div>
        <h2>Données de démo &amp; sauvegardes <span class="role-badge admin">Admin</span></h2>
        <h3>Données de démo</h3>
        <p>Le bouton <b>Importer les données de démo</b> charge des recettes et ingrédients d'exemple, pour tester ou faire une démonstration.</p>
        <h3>Sauvegarde &amp; restauration JSON</h3>
        <ul class="doc-list">
          <li><strong>Exporter</strong> télécharge une sauvegarde JSON des recettes, brassins, notes de dégustation et de votre bibliothèque.</li>
          <li><strong>Restaurer</strong> charge un fichier JSON exporté auparavant. Attention : cela peut écraser des données.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-calendar-check"></i><div>Supabase est le vrai stockage ; les sauvegardes JSON complètent les sauvegardes de la base de données, elles ne les remplacent pas.</div></div>
      </div>
    </section>

    <section class="doc" id="admin-hosting" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-server"></i> Pour les administrateurs</div>
        <h2>Auto-hébergement &amp; configuration <span class="role-badge admin">Admin</span></h2>
        <p>Le code source de BrewBindr est public sous la <a href="https://github.com/jansierens-maker/brewbindr/blob/main/LICENSE.md">PolyForm Noncommercial License 1.0.0</a> : libre pour un usage non commercial. Il vous faut <b>Node.js 26</b>, un projet <b>Supabase</b> (authentification, base de données, temps réel), une <b>clé API Google Gemini</b> pour l'IA et une clé <b>Resend</b> pour les e-mails d'invitation. L'installation de référence tourne sur <b>Vercel</b>.</p>
        <div class="steps">
          <div class="step"><div><b>Cloner et installer :</b></div></div>
        </div>
<pre>git clone https://github.com/jansierens-maker/brewbindr
cd brewbindr
npm install</pre>
        <div class="steps" style="counter-reset: step 1">
          <div class="step"><div><b>Configurez</b> un fichier <code>.env.local</code> (et les mêmes variables dans Vercel) :</div></div>
        </div>
<pre>NEXT_PUBLIC_SUPABASE_URL=your_supabase_project_url
NEXT_PUBLIC_SUPABASE_ANON_KEY=your_supabase_anon_key
GEMINI_API_KEY=your_gemini_api_key
RESEND_API_KEY=your_resend_api_key
NEXT_PUBLIC_SITE_URL=https://your-domain</pre>
        <div class="steps" style="counter-reset: step 2">
          <div class="step"><div><b>Préparez la base de données :</b> exécutez <code>schema_update.sql</code> (le script d'installation complet et rejouable, aussi visible dans l'application sous <b>Détails de connexion</b>) dans l'éditeur SQL de Supabase, ou liez le projet et lancez <code>npx supabase db push</code>.</div></div>
          <div class="step"><div><b>Démarrer :</b> <code>npm run dev</code> pour développer, <code>npm test</code> pour les tests unitaires, <code>npm run build</code> pour la production.</div></div>
        </div>
        <h3>Modifications de la base de données</h3>
        <ul class="doc-list">
          <li>Chaque modification est une nouvelle migration dans <code>supabase/migrations/</code> (rejouable et compatible avec l'application en production), ajoutée aussi à <code>schema_update.sql</code>, avec un test pgTAP dans <code>supabase/tests/database/</code> pour les nouvelles règles.</li>
          <li>GitHub Actions : <b>CI</b> (tests unitaires et build), <b>Playwright E2E</b> à chaque déploiement Vercel, et <b>Database</b> : pour une pull request, une base neuve avec toutes les migrations, les tests de base de données et un essai à blanc contre la production ; lors d'un merge vers <code>main</code>, les migrations sont appliquées après approbation dans l'environnement <code>production</code> (secrets <code>SUPABASE_ACCESS_TOKEN</code> et <code>SUPABASE_DB_PASSWORD</code>).</li>
        </ul>
        <h3>Rôles dans l'application</h3>
        <p>En plus des rôles dans la brasserie, chaque profil a un rôle dans l'application : <code>user</code> ou <code>admin</code>. Seuls les profils <code>admin</code> voient l'écran Admin et ont la limite d'IA plus élevée. Pour nommer un administrateur, modifiez sa ligne dans la table <code>profiles</code>.</p>
        <div class="callout note"><i class="fas fa-shield-halved"></i><div>La protection des données repose sur les <b>règles RLS</b> et les fonctions de base de données de Supabase, pas sur l'interface. Si vous modifiez le schéma, vérifiez que les données de chaque brasserie restent réservées à ses membres.</div></div>
      </div>
    </section>
