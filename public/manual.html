    <!-- ================= VOOR BROUWERS ================= -->
    <section class="doc" id="recipes" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-wand-magic-sparkles"></i> Voor brouwers</div>
        <h2>Recepten &amp; AI <span class="role-badge brewer">Brouwer</span></h2>
        <p>Recepten staan op twee plaatsen: in je <b>Brouwerij</b> (privé, van jou en je team) en in de publieke bibliotheek <b>Recepten</b> (voor iedereen).</p>
        <h3>Een recept maken met AI</h3>
        <div class="steps">
          <div class="step"><div><b>Open Brouwerij → Nieuw recept.</b></div></div>
          <div class="step"><div><b>Beschrijf het bier</b> — stijl, alcohol, bitterheid, bijzondere ingrediënten. Bijvoorbeeld: <code>Een doordrinkbaar Belgisch blond van ±5,5 %, kruidige gist, batch van 20 L</code>.</div></div>
          <div class="step"><div><b>Genereer.</b> De AI (Google Gemini) geeft mout, hop, gist, maischstappen en streefwaarden.</div></div>
          <div class="step"><div><b>Kijk na en pas aan,</b> en bewaar. Zie het resultaat als een sterk eerste ontwerp.</div></div>
        </div>
        <div class="callout note"><i class="fas fa-gauge"></i><div>AI-aanvragen (recepten en proefanalyses) zijn beperkt tot <b>10 per dag</b> per gebruiker, 100 voor beheerders.</div></div>
        <h3>Zelf een recept opbouwen</h3>
        <ul class="doc-list">
          <li><strong>Vergistbare suikers</strong> — kies uit je bibliotheek en zet het <b>soort</b>: mout, ongemout, suiker, vloeibaar of droog extract. Dat telt mee: suiker en extract geven hun volledige extract, en suiker vergist volledig. Kies je een ingrediënt uit de bibliotheek, dan raadt de app het soort uit de naam (bv. "kandijsuiker" → suiker).</li>
          <li><strong>Hop</strong> — hoeveelheid, alfazuur, <b>gebruik</b> (koken, first wort, maischen, whirlpool, droog hoppen), <b>vorm</b> (pellets, bellen, plugs) en tijd. Droge hop telt in dagen; whirlpoolhop krijgt een temperatuur (80 °C als je niets aanpast).</li>
          <li><strong>Gist</strong> — vergistingsgraad per gist.</li>
          <li><strong>Maischschema</strong> — laad er een uit je installatie of pas de stappen aan. Het infusievolume van de eerste stap en de temperatuur van de hoofdrust tellen mee voor het water en de FG.</li>
          <li><strong>Water en waterbehandeling</strong> — zie <a href="#water">Watervolumes</a> en <a href="#water-treatment">Waterbehandeling &amp; pH</a>.</li>
        </ul>
        <p>De donkere balk bovenaan toont de streefwaarden terwijl je typt: ABV, IBU (met BU:GU), kleur (SRM of EBC) en OG (SG of °P). Heb je een bierstijl gekozen, dan vallen waarden buiten de stijl op.</p>
        <h3>Namen, bewerken en verwijderen</h3>
        <ul class="doc-list">
          <li><strong>Kopie</strong> — <i class="fas fa-copy"></i> op een receptkaart of <b>Kopie maken</b> in de editor bewaart een privé kopie met de naam "… (kopie)" en opent ze, bv. om een variant of een kleinere batch te proberen. Brouwsels en proefnotities blijven bij het origineel.</li>
          <li><strong>Unieke namen</strong> — een receptnaam bestaat één keer per brouwerij (hoofdletters en extra spaties tellen niet); in de publieke bibliotheek bestaat elke naam één keer.</li>
          <li><strong>Bewerken of bekijken</strong> — beheerders en brouwmeesters van de brouwerij bewerken alle recepten van de brouwerij; brouwers en proevers openen recepten alleen om te lezen (knop <b>Bekijken</b>). Goedgekeurde publieke recepten kan alleen de beheerder van de app aanpassen.</li>
          <li><strong>Een recept met brouwsels verwijderen</strong> — steunen er nog brouwsels op het recept, dan vraagt de app of je het recept <b>samen met die brouwsels en hun proefnotities</b> wil verwijderen, of wil annuleren. Een recept dat brouwsels van een andere brouwerij gebruiken, kan je niet verwijderen.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-print"></i><div>Elk recept heeft een <b>afdrukweergave</b> — een overzichtelijk brouwdagblad om af te drukken of als pdf te bewaren, met de watervolumes, inmaischtemperatuur, waarschuwingen en waterbehandeling.</div></div>
      </div>
    </section>

    <section class="doc" id="calculations" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-calculator"></i> Voor brouwers</div>
        <h2>Zo rekent BrewBindr <span class="role-badge brewer">Brouwer</span></h2>
        <table>
          <thead><tr><th>Waarde</th><th>Hoe</th></tr></thead>
          <tbody>
            <tr><td><b>OG</b></td><td>Extract van elke grondstof over het batchvolume. Het <b>brouwrendement</b> geldt alleen voor wat gemaischt wordt (mout, ongemout); suiker en extract tellen voor 100 %.</td></tr>
            <tr><td><b>FG</b></td><td>Gemiddelde vergistingsgraad van de gist, ongeveer 1 punt lager per °C dat de hoofdrust boven 66 °C ligt (en hoger eronder), maximaal 5 punten. Suiker vergist volledig, lactose niet.</td></tr>
            <tr><td><b>ABV</b></td><td>De nauwkeurige formule <code>76,08 × (OG − FG) / (1,775 − OG) × FG / 0,794</code>, ook juist voor zware bieren. Flessen: + 0,065 % per g/L bottelsuiker (niet voor een vat).</td></tr>
            <tr><td><b>IBU</b></td><td>Tinseth. Hopbellen ongeveer 10 % minder dan pellets; first-wort-hop 10 % meer; maischhop 20 % van een volledige kooktijd; whirlpoolhop minder naarmate de temperatuur zakt. Met een brouwinstallatie telt de gemiddelde densiteit tijdens het koken.</td></tr>
            <tr><td><b>Kleur</b></td><td>Morey, in SRM of EBC.</td></tr>
            <tr><td><b>BU:GU</b></td><td>IBU gedeeld door de densiteitspunten: rond 0,5 in balans, lager moutig, hoger bitter.</td></tr>
          </tbody>
        </table>
        <div class="callout note"><i class="fas fa-droplet"></i><div>Vul je in een recept zelf het maisch- en spoelwater in, dan volgen OG, FG, ABV, IBU en kleur het volume dat echt uit de ketel komt.</div></div>
      </div>
    </section>

    <section class="doc" id="water" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-droplet"></i> Voor brouwers</div>
        <h2>Watervolumes &amp; inmaischtemperatuur <span class="role-badge brewer">Brouwer</span></h2>
        <p>Het blok <b>Water</b> in het recept (en op de brouwdag) berekent het water uit het recept en je <a href="#installation">brouwinstallatie</a>. Een recept kan zijn installatie kiezen; anders gebruikt de app de enige installatie van je brouwerij ("Standaard: …").</p>
        <h3>Zo worden de volumes bepaald</h3>
        <ul class="doc-list">
          <li><strong>Na het koken</strong> = batch (in de gistingskuip) − aanvulwater + trub- en koelverlies.</li>
          <li><strong>Voor het koken</strong> = na het koken + verdamping (L per uur × kooktijd).</li>
          <li><strong>Totaal water</strong> = voor het koken + water dat de mout opneemt (1 L/kg, BIAB 0,7, of de waarde van de installatie) + lauterverlies.</li>
          <li><strong>Maischwater</strong> = de eerste infusie van het maischschema, anders 3 L/kg; bij BIAB al het water. Nooit meer dan naast de mout past (zie hieronder). <b>Spoelwater</b> is de rest.</li>
          <li><strong>Inmaischtemperatuur</strong> = <code>T + 0,41 / verhouding × (T − temperatuur mout)</code> (Palmer), met T de eerste rust en de verhouding water/mout in L/kg.</li>
          <li><strong>Densiteit voor het koken</strong> volgt uit de OG en de volumes.</li>
        </ul>
        <h3>Toestellen met beperkte ruimte (bv. Brewie)</h3>
        <p>In sommige toestellen zit de mout in zakken in de maischtank: hoe meer mout, hoe minder plaats voor water. Vul bij de installatie de <b>maischcapaciteit</b> (water + mout), het <b>volume van de mout</b> per kg en de <b>capaciteit van de kookketel</b> in. Het berekende maischwater wordt dan nooit meer dan <code>maischcapaciteit − mout × volume per kg</code>; de rest gaat naar het spoelwater. Je krijgt een waarschuwing als het maischwater beperkt werd, als er te veel mout is (minder dan 2 L water per kg past), als je eigen maischwater niet past, als er meer wort is dan de kookketel aankan, of als er meer mout is dan de <b>max. mout</b> van de installatie.</p>
        <h3>Te groot of te klein voor de installatie</h3>
        <p>Past een recept niet in de installatie (meer wort dan de kookketel aankan, te veel mout voor de maischtank of moutpijp, of een grotere batch dan de batchgrootte van de installatie), dan stelt een melding de grootste batch voor die wel past, afgerond naar beneden op 0,5 L. Kan de installatie minstens 10 % meer brouwen, dan stelt ze voor om te vergroten. Alles wordt in verhouding omgerekend: mout (10 g), hop (1 g), andere ingrediënten, droge gist, zouten en zuur (0,1), maischgiften en je eigen water. Densiteit, kleur, bitterheid, tijden en temperaturen blijven gelijk.</p>
        <ul class="doc-list">
          <li><strong>In het recept</strong> — <b>Omrekenen naar …</b> past het recept zelf aan na bevestiging; sla het recept op om het te bewaren.</li>
          <li><strong>Op brouwdag</strong> — dezelfde melding verschijnt bij de brouwdag. Alleen dit brouwsel wordt omgerekend; het recept blijft zoals het is. Het brouwsel toont de nieuwe hoeveelheden, het volume in het gistvat volgt, en het brouwrapport drukt de omgerekende hoeveelheden af. <b>Terug naar de receptgrootte</b> maakt het ongedaan.</li>
        </ul>
        <p>Met de Brewie (kookketel 23 L, verdamping 2 L/u, trubverlies 2 L) past bij 60 minuten koken ongeveer 19 L. Kijk verdamping en verliezen na bij de installatie als dat laag lijkt.</p>
        <h3>Je eigen water</h3>
        <ul class="doc-list">
          <li><strong>Maisch- en spoelwater</strong> vul je per recept zelf in (bv. zoals in Brewie Studio). Druk op Enter of klik buiten het veld. De berekende waarden blijven zichtbaar; <b>Berekend water gebruiken</b> zet ze terug.</li>
          <li>Het blok toont dan hoeveel er <b>in de gistingskuip</b> komt en de <b>verwachte OG</b>, en de cijfers van het recept rekenen mee.</li>
          <li><strong>Alles aftappen in de gistingskuip</strong> — vink aan als je alles aftapt: geen trub- en koelverlies voor dit recept. Standaard uit.</li>
        </ul>
        <div class="callout note"><i class="fas fa-circle-info"></i><div>Niet meegerekend: krimp bij het afkoelen (ongeveer 4 %). Kloppen je volumes telkens niet, pas dan de verliezen of de verdamping van je installatie aan.</div></div>
      </div>
    </section>

    <section class="doc" id="water-treatment" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-vial"></i> Voor brouwers</div>
        <h2>Waterbehandeling &amp; maisch-pH <span class="role-badge brewer">Brouwer</span></h2>
        <h3>Waterprofielen</h3>
        <p>Voeg je leidingwater toe onder <b>Brouwinstallatie → Waterprofielen</b>: calcium, magnesium, natrium, chloride, sulfaat en bicarbonaat in mg/L. Je waterbedrijf publiceert die waarden per adres (zoek naar "waterkwaliteit"). Bicarbonaat staat soms als alkaliteit of tijdelijke hardheid: 1 °dH ≈ 21,8 mg/L, 1 °f TAC ≈ 12,2 mg/L bicarbonaat.</p>
        <p>Altijd beschikbaar: osmosewater, klassieke waters (Pilsen, München, Wenen, Dortmund, Dublin, Edinburgh, Londen, Burton), doelprofielen per kleur en <b>19 profielen per bierstijl</b> (IPA's, NEIPA, pale ale, pils, Belgisch blond, tripel, dubbel, quadrupel, saison, witbier, weizen, amber, Märzen, stouts).</p>
        <h3>Het water van een recept behandelen</h3>
        <div class="steps">
          <div class="step"><div><b>Basiswater</b> — je eigen profiel (je enige profiel staat standaard gekozen) of een klassiek water. Eventueel een deel <b>osmosewater</b>.</div></div>
          <div class="step"><div><b>Doelprofiel</b> — een bierstijl, een kleurprofiel of een ander profiel.</div></div>
          <div class="step"><div><b>Zouten</b> — gips, calciumchloride (vloeibaar 33 % of 36 % in ml, of vlokken in g), Epsom-zout, keukenzout, zuiveringszout. Of klik op <b>Zouten voorstellen</b>: de app zoekt de giften die het dichtst bij het doel komen (zouten kunnen alleen iets toevoegen, niets weghalen).</div></div>
          <div class="step"><div><b>Bekijk het resultaat</b> — de tabel toont basiswater, behandeld water en doel; daaronder de <b>restalkaliteit</b> en de verhouding <b>sulfaat/chloride</b> (boven 2 bitter, 0,8–2 gebalanceerd, onder 0,8 moutig). Onder 40 mg/L calcium krijg je een waarschuwing.</div></div>
        </div>
        <h3>Maisch-pH en zuur</h3>
        <p>Het blok schat de <b>maisch-pH</b> uit de mout (licht, karamel, geroosterd, zuurmout — herkend aan naam of kleur) en het maischwater met alle zouten. Kies een <b>doel-pH</b> (standaard 5,4) en klik op <b>Gebruik … ml</b> om het <b>melkzuur 80 %</b> in te vullen dat dat doel haalt. Je ziet de pH met en zonder zuur; 5,2–5,6 is het gebruikelijke bereik.</p>
        <div class="callout tip"><i class="fas fa-flask-vial"></i><div>Doe alle zouten en het zuur bij de <b>maisch</b>. Het profiel wordt berekend over al het brouwwater samen. De pH is een schatting (meestal tot op ±0,1): meet na met een pH-meter op een afgekoeld staal. Op de brouwdag toont het blok wat je moet toevoegen.</div></div>
      </div>
    </section>

    <section class="doc" id="brewlogs" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-clipboard-list"></i> Voor brouwers</div>
        <h2>Brouwsels <span class="role-badge brewer">Brouwer</span></h2>
        <p>Een brouwsel maakt van een recept een echte batch. Elk brouwsel doorloopt vier fasen; het actieve tabblad volgt de status.</p>
        <div class="pipeline">
          <div class="phase"><i class="fas fa-fire-burner"></i><div class="phase-name">1. Brouwdag</div><div class="phase-desc">Water, gist, maisch, gemeten OG, volume</div></div>
          <div class="phase"><i class="fas fa-flask"></i><div class="phase-name">2. Vergisting</div><div class="phase-desc">FG, gistingstemperatuur</div></div>
          <div class="phase"><i class="fas fa-snowflake"></i><div class="phase-name">3. Lageren</div><div class="phase-desc">Narijping</div></div>
          <div class="phase"><i class="fas fa-bottle-water"></i><div class="phase-name">4. Bottelen</div><div class="phase-desc">Flessen of vat, koolzuur</div></div>
        </div>
        <h3>Brouwdag</h3>
        <ul class="doc-list">
          <li><strong>Water en waterbehandeling</strong> van het recept: volumes, inmaischtemperatuur en wat je toevoegt.</li>
          <li><strong>Gistdosering</strong> — de nodige cellen uit OG, volume en gisttype (ale 0,75, lager 1,5 miljoen cellen/ml/°P, een derde meer boven 1,060), tegenover wat je hebt: droge gist 20 miljard/g, vloeibare gist 100 miljard per pakje min ongeveer 0,7 % per dag sinds de productiedatum. Te weinig vloeibare gist? De app stelt de kleinste starter op een roerplaat voor, met het droog moutextract; bij droge gist hoeveel gram je nodig hebt.</li>
          <li><strong>Gemeten alfazuur</strong> per hop, als het afwijkt van het recept; de IBU rekent mee.</li>
          <li><strong>Gemeten OG en volume</strong> in de gistingskuip.</li>
        </ul>
        <h3>Densiteit meten</h3>
        <ul class="doc-list">
          <li>Vul OG en FG in <b>SG of °P</b> in (zie <a href="#settings">Instellingen</a>); ze worden altijd als SG bewaard.</li>
          <li><strong>Hydrometer</strong> — open onder een densiteitsveld <b>Temperatuur- of refractometercorrectie</b> en vul de temperatuur van het staal in: een knop corrigeert de meting naar 20 °C.</li>
          <li><strong>Refractometer</strong> — vul °Brix in. Voor de OG wordt dat omgerekend met je correctiefactor (WCF); voor de FG ook gecorrigeerd voor alcohol (Terrill), op basis van de OG erboven.</li>
        </ul>
        <h3>Flessen of vat</h3>
        <ul class="doc-list">
          <li><strong>Flessen</strong> — bottelsuiker voor het gekozen aantal volumes CO₂, het soort suiker, het volume en de gistingstemperatuur; de verwachte ABV telt de suiker mee.</li>
          <li><strong>Vat</strong> — de CO₂-druk die je instelt (bar en psi boven de atmosferische druk) voor het gekozen aantal volumes bij de temperatuur van het bier (standaard 4 °C). Geen bottelsuiker, dus geen extra alcohol.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-chart-line"></i><div>De data van de fasen vullen zich in als je de status wijzigt, en blijven aanpasbaar.</div></div>
      </div>
    </section>

    <section class="doc" id="tasting" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-star-half-stroke"></i> Voor brouwers</div>
        <h2>Proefnotities <span class="role-badge brewer">Brouwer</span></h2>
        <p>Is een batch gebotteld, noteer dan hoe hij smaakt: scores voor uitzicht, aroma, smaak en mondgevoel, een totaalscore en commentaar. Elk lid van de brouwerij kan proefnotities toevoegen.</p>
        <h3>Een notitie toevoegen</h3>
        <ul class="doc-list">
          <li><strong>Start</strong> op drie manieren: <b>Proefnotities → Nieuwe proefnotitie</b> — je ziet de vijf laatst gebottelde of geproefde batches, of typ een deel van de receptnaam of het batchnummer om te zoeken; <b>+ Proefnotitie</b> bij een batch in het overzicht; of <b>Beoordelen</b> bij een gebotteld brouwsel. Proevers zien de lijst met brouwsels maar openen ze niet; Beoordelen kunnen ze wel gebruiken.</li>
          <li><strong>Op</strong> — zijn de flessen van een batch op, markeer hem dan met <b>Op</b> in Brouwsels. Hij wordt niet meer aangeboden voor nieuwe notities (vink "Ook opgedronken batches" aan om hem toch te zien); zijn notities blijven.</li>
          <li><strong>Proefdatum</strong> — standaard vandaag; pas ze aan om een proeverij achteraf in te voeren. De notitie toont de leeftijd van het bier, bv. "3 weken na bottelen".</li>
          <li><strong>Proever</strong> — jij, of <b>een gast zonder account</b>: typ zijn naam. Gastnotities krijgen het label <b>Gast</b> en "ingevoerd door" met jouw naam. Om notities toe te voegen moet je altijd aangemeld zijn.</li>
        </ul>
        <h3>Het overzicht</h3>
        <ul class="doc-list">
          <li><strong>Per batch</strong> — notities van hetzelfde brouwsel staan samen onder het recept en zijn batchnummer (batch 1, 2, … op volgorde van brouwdatum), met brouw- en botteldatum, hoeveel keer geproefd, de gemiddelde score en een grafiekje van de totaalscore naar leeftijd.</li>
          <li><strong>Filters</strong> — op proever (leden en gasten), recept en batch; sorteren op nieuwste, oudste of hoogste score. Ook een gebotteld brouwsel toont zijn notities; klik erop om ze te openen.</li>
          <li><strong>Bewerken en verwijderen</strong> — je eigen notities; beheerders en brouwmeesters van de brouwerij kunnen alle notities aanpassen of verwijderen.</li>
          <li><strong>Namen van proevers</strong> — je weergavenaam uit <a href="#settings">Instellingen</a>, anders het deel van je e-mailadres vóór de @.</li>
        </ul>
        <h3>Proefanalyse met AI</h3>
        <div class="steps">
          <div class="step"><div><b>Schrijf je commentaar</b> — wees concreet: "banaanesters overheersen, minder bitter dan verwacht, wat dun".</div></div>
          <div class="step"><div><b>Klik op Analyseren</b> <i class="fas fa-brain" style="font-size:11px"></i>. De AI vergelijkt je beschrijving met het recept.</div></div>
          <div class="step"><div><b>Lees de feedback:</b> waarschijnlijke oorzaken en tips voor het volgende brouwsel. Ze wordt bij de notitie bewaard; open ze later met <b>AI-analyse tonen</b>.</div></div>
        </div>
<div class="callout note"><i class="fas fa-circle-info"></i><div>De analyse heeft geschreven commentaar nodig en telt mee voor je daglimiet aan AI-aanvragen.</div></div>
      </div>
    </section>

    <section class="doc" id="stock" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-boxes-stacked"></i> Voor brouwers</div>
        <h2>Voorraadbeheer <span class="role-badge brewer">Brouwer</span></h2>
        <p>Voorraad is <b>optioneel</b> — zet het aan onder <b>Instellingen → Voorraadbeheer</b>, dan verschijnt "Voorraad" in de zijbalk onder Brouwerij. Recepten tonen dan of je ze kan brouwen met wat je hebt.</p>
        <p>Het voorraadscherm toont je ingrediënten met de hoeveelheid die je hebt. Elk krijgt een <b>glas</b> dat zich vult volgens je voorraad. Probeer maar:</p>
        <div class="glass-demo">
          <svg class="glass-svg" viewBox="0 0 60 80" aria-hidden="true">

            <path d="M8 4 h44 l-5 66 a6 6 0 0 1 -6 5.5 h-22 a6 6 0 0 1 -6 -5.5 Z" fill="#fff" stroke="#CBD5E1" stroke-width="2.5"/>
            <rect id="demoFill" x="0" y="28" width="60" height="80" fill="#F59E0B" clip-path="url(#demoClip)"/>
            <ellipse id="demoFoam" cx="30" cy="28" rx="19" ry="4" fill="#FEF3C7" clip-path="url(#demoClip)"/>
          </svg>
          <div>
            <div class="demo-label">Sleep om de voorraad te simuleren</div>
            <input type="range" id="demoRange" name="demoRange" min="0" max="100" value="65" aria-label="Gesimuleerd voorraadpercentage">
            <div class="demo-pct"><span id="demoPct">65</span>%</div>
          </div>
        </div>
        <h3>Werken met het scherm</h3>
        <ul class="doc-list">
          <li><strong>Filter</strong> op soort ingrediënt of zoek op naam.</li>
          <li><strong>Wissel</strong> tussen kaarten (met glazen) en een compacte tabel.</li>
          <li><strong>Pas hoeveelheden aan</strong> wanneer je iets koopt of gebruikt. Ze worden afgerond: kg tot op de gram, g op hele grammen. Alleen beheerders en brouwmeesters passen de voorraad aan; brouwers kunnen hem bekijken; proevers zien hem niet.</li>
        </ul>
      </div>
    </section>

    <section class="doc" id="library" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-seedling"></i> Voor brouwers</div>
        <h2>Ingrediëntenbibliotheek <span class="role-badge brewer">Brouwer</span></h2>
        <p>De bibliotheek is je catalogus van grondstoffen. In het menu onder <b>Bibliotheek</b> vind je <b>Ingrediënten</b> (mout, hop, gist, overige), <b>Maischprofielen</b>, <b>Bierstijlen</b>, <b>Installaties</b> en <b>Waterprofielen</b>, elk met je eigen collectie en de publieke bibliotheek (installaties en waterprofielen: alleen publiek).</p>
        <table>
          <thead><tr><th>Soort</th><th>Voorbeelden</th><th>Belangrijkste eigenschappen</th></tr></thead>
          <tbody>
            <tr><td><b>Vergistbaar</b></td><td>Pilsmout, Münchener, kandijsuiker</td><td>Opbrengst, kleur</td></tr>
            <tr><td><b>Hop</b></td><td>Saaz, Citra, East Kent Goldings</td><td>Alfazuur %</td></tr>
            <tr><td><b>Gist</b></td><td>Giststammen, bacteriën</td><td>Vergistingsgraad, vorm</td></tr>
            <tr><td><b>Overige</b></td><td>Iers mos, koriander, sinaasappelschil</td><td>Gebruik, moment</td></tr>
            <tr><td><b>Maischschema's, stijlen</b></td><td>Enkelvoudige infusie, BJCP-stijlen</td><td>Stappen; bereik per stijl</td></tr>
          </tbody>
        </table>
        <p>Wat je toevoegt is privé voor je brouwerij, en een naam bestaat één keer per soort in je brouwerij. Bij het maken van recepten kies je uit deze bibliotheek — een goed bijgehouden bibliotheek maakt recepten snel.</p>
        <div class="callout note"><i class="fas fa-upload"></i><div>De <b>beheerder van de brouwerij</b> kan ingrediënten of recepten <b>indienen</b> voor de publieke bibliotheek. Staat de naam er al of wacht hij op goedkeuring, dan krijg je eerst een waarschuwing. Ingediende items verschijnen pas publiek na goedkeuring door een beheerder.</div></div>
        <p>Ook <b>brouwinstallaties en waterprofielen</b> staan in de publieke bibliotheek, onder <b>Bibliotheek → Installaties</b> en <b>Bibliotheek → Waterprofielen</b>: voeg er een toe aan je collectie en ze verschijnt onder Brouwinstallatie. De beheerder van de brouwerij dient de eigen in met de knop <i class="fas fa-cloud-upload-alt"></i> bij de installatie of het waterprofiel (onder Brouwinstallatie). De standaardinstelling (★) wordt niet gedeeld.</p>
      </div>
    </section>

    <section class="doc" id="installation" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-temperature-half"></i> Voor brouwers</div>
        <h2>Brouwinstallatie <span class="role-badge brewer">Brouwer</span></h2>
        <p>Beschrijf je toestel en je water, zodat de berekeningen kloppen met de werkelijkheid. Het scherm heeft drie tabbladen: <b>Installatie</b>, <b>Maischschema's</b> en <b>Waterprofielen</b>. Alles hier wordt gedeeld met je brouwerij.</p>
        <h3>Installatie</h3>
        <p>Vertrek van een voorbeeld of bouw je eigen: batchgrootte, rendement, kooktijd, vaten, en de waarden die de waterberekening gebruikt:</p>
        <table>
          <thead><tr><th>Veld</th><th>Gebruikt voor</th></tr></thead>
          <tbody>
            <tr><td>Trub- en koelverlies, aanvulwater</td><td>Volumes na het koken</td></tr>
            <tr><td>Verdamping (L/u)</td><td>Volume en densiteit voor het koken</td></tr>
            <tr><td>Lauterverlies</td><td>Totaal water</td></tr>
            <tr><td>Maischcapaciteit (water + mout), volume mout in de maisch (L/kg)</td><td>Maximaal maischwater</td></tr>
            <tr><td>Opname door mout (L/kg)</td><td>Totaal water (standaard 1,0, BIAB 0,7)</td></tr>
            <tr><td>Capaciteit kookketel</td><td>Waarschuwing bij te veel wort</td></tr>
            <tr><td>Max. mout (kg)</td><td>Waarschuwing als er meer mout is dan de moutpijp of maischtank aankan; de batch kan verkleind worden</td></tr>
          </tbody>
        </table>
        <h3>Welke installatie gebruikt wordt</h3>
        <p>Watervolumes, inmaischtemperatuur en omrekenen gebruiken, in deze volgorde: de installatie gekozen voor het brouwsel, die van het recept, de <b>standaardinstallatie</b> van de brouwerij. Klik op de ★ bij een installatie om ze standaard te maken; klik opnieuw om de standaard te verwijderen. Een brouwerij met maar één installatie gebruikt die. Met meerdere installaties vraagt <b>Brouwen</b> eerst op welke installatie je brouwt (die van het recept is aangeduid), tenzij er een standaard is en het recept die gebruikt of geen installatie vermeldt. Op brouwdag kun je ze nog wijzigen in het waterblok; het recept blijft zoals het is.</p>
        <details>
          <summary>Ingebouwde voorbeeldinstallaties</summary>
          <div class="details-body">
            <table>
              <thead><tr><th>Voorbeeld</th><th>Type</th><th>Batch</th><th>Rendement</th></tr></thead>
              <tbody>
                <tr><td>Brewie</td><td>Twee vaten (maischcapaciteit 22 L, 1 L/kg, kookketel 23 L)</td><td>23 L</td><td>70%</td></tr>
                <tr><td>Grainfather G30</td><td>Alles-in-één</td><td>25 L</td><td>72%</td></tr>
                <tr><td>Grainfather G40</td><td>Alles-in-één (46 L, max. 13 kg mout)</td><td>35 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B40</td><td>Alles-in-één (40 L, max. 8 kg mout)</td><td>30 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B50</td><td>Alles-in-één (50 L, max. 12 kg mout)</td><td>45 L</td><td>72%</td></tr>
                <tr><td>Brew Monk B70</td><td>Alles-in-één (70 L, max. 18 kg mout)</td><td>65 L</td><td>72%</td></tr>
                <tr><td>Robobrew / BrewZilla</td><td>Alles-in-één</td><td>30 L</td><td>70%</td></tr>

                <tr><td>Klassiek 3-vaten 20 L</td><td>Heetwater, maisch, kook</td><td>20 L</td><td>75%</td></tr>
                <tr><td>Klassiek 3-vaten 30 L</td><td>Heetwater, maisch, kook</td><td>30 L</td><td>75%</td></tr>
              </tbody>
            </table>
          </div>
        </details>
        <h3>Maischschema's</h3>
        <p>Herbruikbare maischschema's (temperatuur, duur, type, infusievolume). Laad er een in een recept; het verschijnt als checklist op de brouwdag. Temperaturen worden bewaard tot op 0,1 °C.</p>
        <h3>Waterprofielen</h3>
        <p>Je leidingwater en andere waters met hun mineralen; zie <a href="#water-treatment">Waterbehandeling</a>.</p>
      </div>
    </section>

    <section class="doc" id="import" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-arrow-up-from-bracket"></i> Voor brouwers</div>
        <h2>Importeren &amp; exporteren <span class="role-badge brewer">Brouwer</span></h2>
        <p>BrewBindr spreekt <b>BeerXML</b>, het uitwisselformaat van brouwsoftware (BeerSmith, Brewfather en andere).</p>
        <h3>Importeren</h3>
        <div class="steps">
          <div class="step"><div><b>Open Brouwerij → Importeren.</b> Je moet aangemeld zijn als beheerder of brouwmeester (importeren voegt recepten en ingrediënten toe); exporteren kan iedereen.</div></div>
          <div class="step"><div><b>Kies een bestand</b> — <code>.xml</code> of <code>.beerxml</code>, tot <b>10 MB</b>, met recepten of ingrediënten.</div></div>
          <div class="step"><div><b>Bekijk het resultaat.</b> Recepten komen in je brouwerij, ingrediënten in je bibliotheek.</div></div>
        </div>
        <p>Geïmporteerde waarden worden opgekuist (bv. 2,041164 kg → 2,041 kg, 65,555556 °C → 65,6 °C). Het soort vergistbaar, hopgebruik en -vorm, en de mineralen van waterprofielen worden mee ingelezen.</p>
        <h3>Exporteren</h3>
        <p>Exporteer een recept naar BeerXML vanuit het recept, als back-up of voor andere software. Soorten, hopgebruik en -vorm blijven behouden, en imperiale hoeveelheden worden in kg geschreven.</p>
      </div>
    </section>

    <section class="doc" id="team" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-users"></i> Voor brouwers</div>
        <h2>Team &amp; rollen <span class="role-badge brewer">Brouwer</span></h2>
        <p>Elke gebruiker hoort bij een <b>brouwerij</b> — een gedeelde werkruimte. Elk lid heeft een van vier rollen:</p>
        <table>
          <thead><tr><th>Rol</th><th>Rechten</th></tr></thead>
          <tbody>
            <tr><td><b>Beheerder</b></td><td>Alles wat een brouwmeester kan, plus leden, uitnodigingen, de naam van de brouwerij en recepten, ingrediënten, installaties en waterprofielen indienen voor de publieke bibliotheek.</td></tr>
            <tr><td><b>Brouwmeester</b></td><td>Maakt, bewerkt en verwijdert alle recepten, ingrediënten en installatiegegevens van de brouwerij; houdt brouwsels bij.</td></tr>
            <tr><td><b>Brouwer</b></td><td>Houdt brouwsels bij; bekijkt recepten (alleen lezen).</td></tr>
            <tr><td><b>Proever</b></td><td>Bekijkt recepten en de lijst met brouwsels (zonder ze te openen); voegt proefnotities toe. Ziet de voorraad niet.</td></tr>
          </tbody>
        </table>
        <h3>Uitnodigen en aansluiten</h3>
        <ul class="doc-list">
          <li><strong>Uitnodigen</strong> — vul in het scherm <b>Team</b> een e-mailadres en een rol in. De uitgenodigde krijgt een e-mail met een code, 7 dagen geldig. Bij elke uitnodiging zie je hoe vaak de mail verstuurd is en kun je hem opnieuw versturen (maximaal 3 keer); een brouwerij verstuurt maximaal 10 uitnodigingsmails per dag. Lukt de mail niet, dan blijft de uitnodiging bestaan: geef de code dan zelf door. De code werkt in hoofd- of kleine letters.</li>
          <li><strong>Aansluiten</strong> — vul de code in bij het aanmaken van je account, of later onder <b>Aansluiten bij een andere brouwerij</b>. Je eigen recepten, brouwsels, proefnotities en ingrediënten verhuizen mee; dat kan als je het enige lid bent van je huidige brouwerij. Namen die al bestaan krijgen "(2)" erbij.</li>
          <li><strong>Verwijderen</strong> — een beheerder kan leden verwijderen in het scherm Team.</li>
        </ul>
      </div>
    </section>

    <section class="doc" id="settings" data-audience="brewer">
      <div class="card">
        <div class="section-eyebrow"><i class="fas fa-gear"></i> Voor brouwers</div>
        <h2>Instellingen <span class="role-badge all">Iedereen</span></h2>
        <p>Onder <b>Systeem → Instellingen</b> stel je BrewBindr af op jouw manier:</p>
        <ul class="doc-list">
          <li><strong>Eenheden</strong> — metrisch (L, kg, °C) of imperiaal (gal, lb, °F), overal.</li>
          <li><strong>Kleurschaal</strong> — SRM of EBC.</li>
          <li><strong>Dichtheid</strong> — SG, °P of beide, om densiteiten te tonen en in te vullen.</li>
          <li><strong>Correctiefactor refractometer (WCF)</strong> — meestal 1,02–1,06, 1,04 als je het niet weet. Meet een wort met hydrometer én refractometer om je eigen factor te vinden.</li>
          <li><strong>Voorraadbeheer</strong> — aan of uit (zie <a href="#stock">Voorraad</a>).</li>
          <li><strong>Taal</strong> — English, Nederlands of Français.</li>
          <li><strong>Weergavenaam</strong> — onder Account: de naam die je team ziet, bv. als proever bij je proefnotities (max. 40 tekens).</li>
          <li><strong>Wachtwoord wijzigen</strong> — onder Account: je huidige wachtwoord en twee keer het nieuwe (minstens 12 tekens, niet bekend uit datalekken). Vergeten? Gebruik <b>Wachtwoord vergeten?</b> op het aanmeldscherm: je krijgt een mail met een link, een uur geldig, waarmee je een nieuw wachtwoord kiest.</li>
          <li><strong>Account</strong> — met welk account je aangemeld bent, en afmelden.</li>
        </ul>
        <p class="kbd-note">Je voorkeuren worden bij je profiel bewaard en volgen je op al je toestellen.</p>
      </div>
    </section>

    <!-- ================= VOOR BEHEERDERS ================= -->
    <section class="doc" id="admin-submissions" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-clipboard-check"></i> Voor beheerders</div>
        <h2>Publieke bibliotheek <span class="role-badge admin">Beheer</span></h2>
        <h3>Ingediende items beoordelen</h3>
        <p>Beheerders van een brouwerij kunnen recepten en ingrediënten indienen voor de publieke bibliotheek. Niets verschijnt zonder controle: ingediende items wachten in het scherm <b>Beheer</b> onder <b>Te beoordelen</b>.</p>
        <div class="steps">
          <div class="step"><div><b>Open het scherm Beheer.</b> Elk item toont soort, naam en wie het indiende.</div></div>
          <div class="step"><div><b>Beoordeel de kwaliteit:</b> volledige en geloofwaardige gegevens, een zinvolle naam. Namen in de publieke bibliotheek zijn uniek: een item goedkeuren waarvan de naam al publiek is, wordt geweigerd.</div></div>
          <div class="step"><div><b>Goedkeuren</b> om te publiceren, of <b>Weigeren</b>.</div></div>
        </div>
        <h3>Opkuisen</h3>
        <p>In de publieke bibliotheek zien beheerders bij recepten en ingrediënten <b>Uit publiek halen</b> (het item wordt weer privé) en <b>Verwijderen</b>. Een publiek recept dat brouwsels van andere brouwerijen gebruiken, kan je niet verwijderen.</p>
        <div class="callout warn"><i class="fas fa-triangle-exclamation"></i><div>Goedgekeurde inhoud is zichtbaar voor <b>iedereen</b>, ook voor gasten.</div></div>
      </div>
    </section>

    <section class="doc" id="admin-tools" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-tools"></i> Voor beheerders</div>
        <h2>Demodata &amp; back-ups <span class="role-badge admin">Beheer</span></h2>
        <h3>Demodata</h3>
        <p>De knop <b>Demodata importeren</b> laadt voorbeeldrecepten en -ingrediënten, om te testen of te demonstreren.</p>
        <h3>JSON-back-up &amp; herstel</h3>
        <ul class="doc-list">
          <li><strong>Exporteren</strong> downloadt een JSON-back-up van recepten, brouwsels, proefnotities en je bibliotheek.</li>
          <li><strong>Herstellen</strong> laadt een eerder geëxporteerd JSON-bestand. Opgelet: dit kan gegevens overschrijven.</li>
        </ul>
        <div class="callout tip"><i class="fas fa-calendar-check"></i><div>Supabase is de eigenlijke opslag; JSON-back-ups vullen de databaseback-ups aan, ze vervangen ze niet.</div></div>
      </div>
    </section>

    <section class="doc" id="admin-hosting" data-audience="admin">
      <div class="card">
        <div class="section-eyebrow admin"><i class="fas fa-server"></i> Voor beheerders</div>
        <h2>Zelf hosten &amp; configureren <span class="role-badge admin">Beheer</span></h2>
        <p>De broncode van BrewBindr is publiek onder de <a href="https://github.com/jansierens-maker/brewbindr/blob/main/LICENSE.md">PolyForm Noncommercial License 1.0.0</a>: vrij te gebruiken voor niet-commerciële doeleinden. Je hebt <b>Node.js 26</b> nodig, een <b>Supabase</b>-project (authenticatie, database, realtime), een <b>Google Gemini API-sleutel</b> voor AI en een <b>Resend</b>-sleutel voor de uitnodigingsmails. De referentie-installatie draait op <b>Vercel</b>.</p>
        <div class="steps">
          <div class="step"><div><b>Kopiëren en installeren:</b></div></div>
        </div>
<pre>git clone https://github.com/jansierens-maker/brewbindr
cd brewbindr
npm install</pre>
        <div class="steps" style="counter-reset: step 1">
          <div class="step"><div><b>Configureer</b> een bestand <code>.env.local</code> (en dezelfde variabelen in Vercel):</div></div>
        </div>
<pre>NEXT_PUBLIC_SUPABASE_URL=your_supabase_project_url
NEXT_PUBLIC_SUPABASE_ANON_KEY=your_supabase_anon_key
GEMINI_API_KEY=your_gemini_api_key
RESEND_API_KEY=your_resend_api_key
NEXT_PUBLIC_SITE_URL=https://your-domain</pre>
        <div class="steps" style="counter-reset: step 2">
          <div class="step"><div><b>Zet de database op:</b> voer <code>schema_update.sql</code> uit (het volledige, herhaalbare opzetscript, ook te zien in de app onder <b>Verbindingsgegevens</b>) in de SQL-editor van Supabase, of koppel het project en voer <code>npx supabase db push</code> uit.</div></div>
          <div class="step"><div><b>Starten:</b> <code>npm run dev</code> om te ontwikkelen, <code>npm test</code> voor de unit tests, <code>npm run build</code> voor productie.</div></div>
        </div>
        <h3>Wijzigingen aan de database</h3>
        <ul class="doc-list">
          <li>Elke wijziging is een nieuwe migratie in <code>supabase/migrations/</code> (herhaalbaar en verenigbaar met de draaiende app), ook toegevoegd aan <code>schema_update.sql</code>, met een pgTAP-test in <code>supabase/tests/database/</code> voor nieuwe regels.</li>
          <li>GitHub Actions: <b>CI</b> (unit tests en build), <b>Playwright E2E</b> bij elke Vercel-deployment, en <b>Database</b>: bij een pull request een verse database met alle migraties, de databasetests en een proefrun tegen productie; bij een merge naar <code>main</code> worden de migraties toegepast na goedkeuring in de omgeving <code>production</code> (secrets <code>SUPABASE_ACCESS_TOKEN</code> en <code>SUPABASE_DB_PASSWORD</code>).</li>
        </ul>
        <h3>Rollen in de app</h3>
        <p>Naast de rollen in de brouwerij heeft elk profiel een rol in de app: <code>user</code> of <code>admin</code>. Alleen <code>admin</code>-profielen zien het scherm Beheer en krijgen de hogere AI-limiet. Maak iemand beheerder door zijn rij in de tabel <code>profiles</code> aan te passen.</p>
        <div class="callout note"><i class="fas fa-shield-halved"></i><div>De afscherming van gegevens gebeurt door de <b>RLS-regels</b> en databasefuncties van Supabase, niet door de frontend. Pas je het schema aan, controleer dan dat de gegevens van elke brouwerij bij haar leden blijven.</div></div>
      </div>
